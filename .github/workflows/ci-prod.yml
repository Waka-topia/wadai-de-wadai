name: CI (prod)

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format

      - name: Run ESLint
        run: npm run lint

      - name: Create .env.production
        run: |
          cat <<EOF > .env.production
          VITE_API_KEY=${{ secrets.PROD_VITE_API_KEY }}
          VITE_AUTH_DOMAIN=${{ secrets.PROD_VITE_AUTH_DOMAIN }}
          VITE_PROJECT_ID=${{ secrets.PROD_VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET=${{ secrets.PROD_VITE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID=${{ secrets.PROD_VITE_MESSAGING_SENDER_ID }}
          VITE_APP_ID=${{ secrets.PROD_VITE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.PROD_VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_MAPTILER_API_KEY=${{ secrets.PROD_VITE_MAPTILER_API_KEY }}
          VITE_ADMIN_UID=${{ secrets.PROD_VITE_ADMIN_UID }}
          EOF

      - name: Run Build (prod)
        run: npm run build:prod

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Files were modified by formatter or linter"
            git diff
            exit 1
          fi

      - name: Deploy to Firebase (prod)
        if: github.event_name == 'push'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --project wadai-de-wadai
