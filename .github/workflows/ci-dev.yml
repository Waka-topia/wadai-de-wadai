name: CI (dev)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format

      - name: Run ESLint
        run: npm run lint

      - name: Create .env.development
        run: |
          cat <<EOF > .env.development
          VITE_API_KEY=${{ secrets.DEV_VITE_API_KEY }}
          VITE_AUTH_DOMAIN=${{ secrets.DEV_VITE_AUTH_DOMAIN }}
          VITE_PROJECT_ID=${{ secrets.DEV_VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET=${{ secrets.DEV_VITE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID=${{ secrets.DEV_VITE_MESSAGING_SENDER_ID }}
          VITE_APP_ID=${{ secrets.DEV_VITE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.DEV_VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_MAPTILER_API_KEY=${{ secrets.DEV_VITE_MAPTILER_API_KEY }}
          VITE_ADMIN_UID=${{ secrets.DEV_VITE_ADMIN_UID }}
          EOF

      - name: Run Build (dev)
        run: npm run build:dev

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Files were modified by formatter or linter"
            git diff
            exit 1
          fi
