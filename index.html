<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: キーボード表示時にレイアウトを縮めて、下端のシートが隠れないようにする -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>和大DE話題(2025年4月復刻版)</title>

    <!-- SEO -->
    <meta
      name="description"
      content="2025年新歓シーズンの和大DE話題を復刻したデモ版。QRコードでサークルのスタンプを集めて、ランキングを競えます"
    />
    <meta name="keywords" content="大学,新歓,サークル,スタンプラリー,QRコード,ランキング,学生" />
    <!-- 復刻版は検索結果に出さない（本番と紛らわしいため） -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="和大DE話題(2025年4月復刻版)" />
    <meta property="og:title" content="和大DE話題(2025年4月復刻版)" />
    <meta
      property="og:description"
      content="2025年新歓シーズンの和大DE話題を復刻したデモ版。QRコードでサークルのスタンプを集めて、ランキングを競えます"
    />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="和大DE話題(2025年4月復刻版)" />
    <meta
      name="twitter:description"
      content="2025年新歓シーズンの和大DE話題を復刻したデモ版。QRコードでサークルのスタンプを集めて、ランキングを競えます"
    />

    <!-- PWA / ブラウザ -->
    <meta name="theme-color" content="#FF9900" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/AppIcon192-192.png" />
    <link rel="apple-touch-icon" href="/icons/AppIcon192-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.js" type="module"></script>
  </body>
</html>
